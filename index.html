<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocene (lite)</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box}
body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;background:#e2e8f0;color:#1e293b;font-size:16px}
.bar{background:#0f172a;color:#fff;padding:10px 16px;overflow:hidden}
.bar b{color:#34d399}
#who{line-height:34px}
.mb{float:left;background:#1e293b;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:20px;margin-right:12px;line-height:1.3}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #cbd5e1}
input[type=text],input[type=date],input[type=time]{width:100%;padding:12px;font-size:16px;border:1px solid #94a3b8;border-radius:8px;margin:4px 0 12px;background:#fff;-webkit-appearance:none}
.btn{width:100%;padding:13px;font-size:16px;font-weight:bold;color:#fff;background:#059669;border:0;border-radius:8px}
.btn2{padding:10px 16px;font-size:15px;font-weight:bold;color:#334155;background:#e2e8f0;border:0;border-radius:8px}
.err{color:#be123c;font-weight:bold;margin-top:10px}
.stats{display:table;width:100%;table-layout:fixed}
.stat{display:table-cell;text-align:center;padding:4px}
.stat .v{font-size:26px;font-weight:bold;color:#059669}
.stat .l{font-size:11px;color:#64748b;text-transform:uppercase}
.sem{background:#f1f5f9;padding:10px 14px;font-weight:bold;margin:-14px -14px 6px;border-radius:12px 12px 0 0}
.row{display:table;width:100%;border-bottom:1px solid #e2e8f0;padding:8px 0}
.row>div{display:table-cell;vertical-align:middle}
.row .e{width:60px;text-align:center;color:#64748b;font-size:13px}
.row .g{width:110px;text-align:right}
select{font-size:16px;padding:8px;border-radius:6px;border:1px solid #94a3b8;background:#fff;max-width:100%}
.ok{color:#059669}
h3{margin:0 0 10px}
#msg{position:fixed;left:0;right:0;bottom:0;background:#0f172a;color:#fff;text-align:center;padding:10px;font-size:14px;display:none;z-index:99}

/* side menu */
#ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:40;display:none}
#menu{position:fixed;top:0;left:0;bottom:0;width:260px;background:#0f172a;color:#fff;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;
  -webkit-transform:translateX(-280px);transform:translateX(-280px);-webkit-transition:-webkit-transform .2s;transition:transform .2s}
#menu.open{-webkit-transform:translateX(0);transform:translateX(0)}
.mh{padding:18px 20px;font-weight:bold;font-size:18px;color:#34d399;border-bottom:1px solid #1e293b}
.mi{display:block;width:100%;text-align:left;padding:16px 20px;background:none;border:0;border-bottom:1px solid #1e293b;color:#e2e8f0;font-size:17px}
.mi.on{background:#1e293b;color:#34d399}
.mi.out{color:#fda4af}

/* tasks */
.trow{display:table;width:100%;border-bottom:1px solid #e2e8f0;padding:8px 0}
.trow>div{display:table-cell;vertical-align:middle}
.trow .c{width:40px}
.trow .c input{width:24px;height:24px}
.trow .d{width:110px;text-align:right;font-size:12px;font-weight:bold;color:#64748b}
.trow .x{width:44px;text-align:right}
.trow .x button{background:none;border:0;font-size:20px;color:#94a3b8;padding:4px 8px}
.tdone .t{text-decoration:line-through;color:#94a3b8}
.tsub{font-size:11px;color:#94a3b8}
.late{color:#e11d48!important}

/* uslovi */
.urow{display:table;width:100%;border-bottom:1px solid #e2e8f0;padding:10px 0}
.urow>div{display:table-cell;vertical-align:middle}
.urow .bd{width:130px;text-align:right}
.ul{font-weight:bold}
.us{font-size:12px;color:#64748b}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:bold}
.pill.y{background:#d1fae5;color:#047857}
.pill.n{background:#ffe4e6;color:#be123c}
.ex{display:inline-block;font-size:10px;font-weight:bold;color:#e11d48;background:#fff1f2;border-radius:999px;padding:2px 6px;margin-left:6px}
.warn{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px;margin-top:12px;font-size:13px;color:#92400e}

/* schedule */
.tabs{margin-bottom:12px}
.tab,.yr{display:inline-block;padding:10px 16px;margin:0 6px 6px 0;border:2px solid #cbd5e1;background:#fff;border-radius:8px;font-size:15px;font-weight:bold;color:#475569}
.tab.on,.yr.on{background:#059669;border-color:#059669;color:#fff}
.wk{width:100%;table-layout:fixed;border-collapse:collapse;background:#fff}
.wk th{background:#0f172a;color:#fff;font-size:13px;padding:8px 2px}
.wk td{vertical-align:top;border:1px solid #e2e8f0;padding:4px;height:80px}
.sl{border-left:5px solid #059669;background:#f8fafc;border-radius:4px;padding:4px 6px;margin-bottom:5px;font-size:12px;word-wrap:break-word}
.sl .tm{font-weight:bold}
.sl .nt{color:#64748b;font-size:11px}
.sl .cf{color:#e11d48;font-weight:bold}
.days label{display:inline-block;margin:0 10px 10px 0;font-size:15px}
.days input{width:20px;height:20px;vertical-align:middle;margin-right:4px}
.half{width:48%;display:inline-block;vertical-align:top}
.half+.half{margin-left:3%}
.lbl{font-size:12px;font-weight:bold;color:#64748b;text-transform:uppercase}
.srow{display:table;width:100%;border-bottom:1px solid #e2e8f0;padding:8px 0}
.srow>div{display:table-cell;vertical-align:middle}
.srow .b{width:150px;text-align:right}
.srow button{padding:8px 12px;font-size:14px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;margin-left:4px}
.abswarn{color:#e11d48;font-weight:bold}
.at{margin-top:4px;white-space:nowrap}
.ab{width:46%;padding:3px 0;font-size:13px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;margin-right:2%;color:#64748b}
.ab.pon{background:#059669;border-color:#059669;color:#fff}
.ab.aon{background:#e11d48;border-color:#e11d48;color:#fff}
</style>
</head>
<body>
<div id="login" class="wrap">
  <div class="card">
    <h2 style="margin-top:0">Studentski portal (lite)</h2>
    <label>Ime i prezime</label><input type="text" id="ln" autocapitalize="none" autocorrect="off">
    <label>Broj indeksa</label><input type="text" id="li" autocapitalize="none" autocorrect="off">
    <button class="btn" onclick="doLogin()">Prijavi se</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="bar"><button class="mb" onclick="toggleMenu()">&#9776;</button><span id="who"></span></div>

  <div id="ov" onclick="toggleMenu()"></div>
  <div id="menu">
    <div class="mh">Meni</div>
    <button class="mi" id="mi-grades" onclick="show('grades')">&#127891; Ocene</button>
    <button class="mi" id="mi-tasks" onclick="show('tasks')">&#9989; Zadaci</button>
    <button class="mi" id="mi-uslovi" onclick="show('uslovi')" style="display:none">&#9878; Uslovi za nastavak</button>
    <button class="mi" id="mi-sched" onclick="show('sched')">&#128197; Raspored</button>
    <button class="mi out" onclick="doLogout()">&#10162; Odjava</button>
  </div>

  <div class="wrap">
    <!-- OCENE -->
    <div class="view" id="v-grades">
      <div class="card"><div class="stats">
        <div class="stat"><div class="v" id="s-avg">0.00</div><div class="l">Prosek</div></div>
        <div class="stat"><div class="v" id="s-espb">0</div><div class="l">ESPB / 240</div></div>
        <div class="stat"><div class="v" id="s-pass">0</div><div class="l">Polo&#382;eno</div></div>
      </div></div>
      <div id="list"></div>
    </div>

    <!-- ZADACI -->
    <div class="view" id="v-tasks" style="display:none">
      <div class="card">
        <h3>Novi zadatak</h3>
        <select id="t-sub" style="width:100%;margin-bottom:10px"></select>
        <input type="text" id="t-text" placeholder="Zadatak...">
        <span class="lbl">Do kada (nije obavezno)</span>
        <input type="date" id="t-due">
        <button class="btn" onclick="addTask()">Dodaj zadatak</button>
      </div>
      <div class="card">
        <div style="margin-bottom:8px"><label><input type="checkbox" id="t-hide" onchange="renderTasks()" style="width:20px;height:20px;vertical-align:middle"> Sakrij ura&#273;eno</label></div>
        <div id="tl"></div>
      </div>
    </div>

    <!-- USLOVI -->
    <div class="view" id="v-uslovi" style="display:none">
      <div class="card"><h3>Uslovi za nastavak studija</h3><div id="ubody"></div></div>
    </div>

    <!-- RASPORED -->
    <div class="view" id="v-sched" style="display:none">
      <div class="card">
        <span class="lbl">Godina studija</span>
        <div style="margin-top:6px" id="s-years"></div>
        <div class="tabs" id="s-tabs"></div>
        <div id="s-body"></div>
      </div>
    </div>
  </div>
</div>
<div id="msg"></div>

<script>
var SB_URL = 'https://nhffxmmmwoonnkhvrqev.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZmZ4bW1td29vbm5raHZycWV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNzEzNDcsImV4cCI6MjA5NDk0NzM0N30.FG2gdhNRXJxRnPVKdQ8qLGlwcaJ4nSUpKJJrfq4YsDc';
var user = null, subjects = [], curView = 'grades';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return (n < 10 ? '0' : '') + n; }

function api(method, path, body, cb, prefer){
  var x = new XMLHttpRequest();
  x.open(method, SB_URL + '/rest/v1/' + path, true);
  x.setRequestHeader('apikey', SB_KEY);
  x.setRequestHeader('Authorization', 'Bearer ' + SB_KEY);
  x.setRequestHeader('Content-Type', 'application/json');
  if (method !== 'GET') x.setRequestHeader('Prefer', prefer || 'return=minimal');
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    var ok = x.status >= 200 && x.status < 300, d = null;
    try { d = x.responseText ? JSON.parse(x.responseText) : null; } catch (e) {}
    cb(ok, d);
  };
  x.send(body ? JSON.stringify(body) : null);
}

var msgTimer = null;
function toast(t){
  var m = $('msg'); m.textContent = t; m.style.display = 'block';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(function(){ m.style.display = 'none'; }, 2500);
}

/* ---------- LOGIN ---------- */
function doLogin(){
  var name = $('ln').value.replace(/^\s+|\s+$/g,'');
  var idx = $('li').value.replace(/^\s+|\s+$/g,'');
  var err = $('lerr'); err.textContent = '';
  if (!name || !idx){ err.textContent = 'Unesi ime i broj indeksa.'; return; }
  var key = name.toLowerCase();
  api('GET', 'users?select=key,display_name,index_number,accepted_terms,show_study_status&key=eq.' + encodeURIComponent(key), null, function(ok, d){
    if (!ok){ err.textContent = 'Gre\u0161ka u vezi sa serverom.'; return; }
    if (!d || !d.length || d[0].index_number !== idx){ err.textContent = 'Neva\u017ee\u0107a kombinacija imena i indeksa.'; return; }
    if (!d[0].accepted_terms){ err.textContent = 'Prvo se prijavi na glavnu aplikaciju i prihvati uslove kori\u0161\u0107enja.'; return; }
    user = { key: d[0].key, name: d[0].display_name, index: idx, showStatus: !!d[0].show_study_status };
    try { localStorage.setItem('liteSession', JSON.stringify({ n: name, i: idx })); } catch (e) {}
    loadSubjects();
  });
}

function doLogout(){
  try { localStorage.removeItem('liteSession'); } catch (e) {}
  user = null; subjects = []; allSlots = []; att = {};
  $('menu').className = ''; $('ov').style.display = 'none';
  $('app').style.display = 'none'; $('login').style.display = 'block';
}

function loadSubjects(){
  toast('U\u010ditavanje...');
  api('GET', 'student_subjects?select=subject_id,name,grade,espb,semester,todos,absence_limit&order=semester.asc&user_key=eq.' + encodeURIComponent(user.key), null, function(ok, d){
    if (!ok){ toast('Gre\u0161ka pri u\u010ditavanju.'); return; }
    subjects = [];
    for (var i = 0; i < d.length; i++){
      subjects.push({ id: d[i].subject_id, name: d[i].name, espb: d[i].espb, semester: d[i].semester, limit: d[i].absence_limit || 3,
        grade: d[i].grade === 1 ? 'p' : (d[i].grade == null ? '' : d[i].grade),
        todos: (d[i].todos && d[i].todos.length !== undefined) ? d[i].todos : [] });
    }
    loadSchedData(function(){
    $('login').style.display = 'none'; $('app').style.display = 'block';
    $('who').innerHTML = '<b>' + esc(user.name) + '</b> (' + esc(user.index) + ')';
    $('mi-uslovi').style.display = user.showStatus ? 'block' : 'none';
    schedYear = 0; schedTab = 'view'; editId = null; schedWeek = 0;
    show('grades');
    });
  });
}

/* ---------- MENU / VIEWS ---------- */
function toggleMenu(){
  var m = $('menu'), open = m.className.indexOf('open') === -1;
  m.className = open ? 'open' : '';
  $('ov').style.display = open ? 'block' : 'none';
}

function show(v){
  if (v === 'uslovi' && !user.showStatus) v = 'grades';
  curView = v;
  var names = ['grades','tasks','uslovi','sched'];
  for (var i = 0; i < names.length; i++){
    $('v-' + names[i]).style.display = names[i] === v ? 'block' : 'none';
    $('mi-' + names[i]).className = 'mi' + (names[i] === v ? ' on' : '');
  }
  $('menu').className = ''; $('ov').style.display = 'none';
  if (v === 'grades') render();
  else if (v === 'tasks') renderTasks();
  else if (v === 'uslovi') renderUslovi();
  else if (v === 'sched') renderSched();
  window.scrollTo(0, 0);
}

/* ---------- OCENE ---------- */
function passed(g){ return g === 'p' || (typeof g === 'number' && g >= 6); }

function stats(){
  var sum = 0, n = 0, espb = 0, p = 0;
  for (var i = 0; i < subjects.length; i++){
    var s = subjects[i];
    if (typeof s.grade === 'number' && s.grade >= 6){ sum += s.grade; n++; }
    if (passed(s.grade)){ espb += s.espb; p++; }
  }
  $('s-avg').textContent = n ? (sum / n).toFixed(2) : '0.00';
  $('s-espb').textContent = espb;
  $('s-pass').textContent = p + '/' + subjects.length;
}

function render(){
  var html = '';
  for (var sem = 1; sem <= 8; sem++){
    var rows = '', cnt = 0;
    for (var i = 0; i < subjects.length; i++){
      var s = subjects[i];
      if (s.semester !== sem) continue;
      cnt++;
      var opts = '<option value="">\u2014</option>';
      for (var g = 6; g <= 10; g++) opts += '<option value="' + g + '"' + (s.grade === g ? ' selected' : '') + '>' + g + '</option>';
      opts += '<option value="p"' + (s.grade === 'p' ? ' selected' : '') + '>Polo\u017een</option>';
      rows += '<div class="row"><div>' + (passed(s.grade) ? '<span class="ok">\u2713</span> ' : '') + nameHtml(s.id, s.name) +
        '</div><div class="e">' + s.espb + ' ESPB</div><div class="g"><select onchange="setGrade(' + i + ',this.value)">' + opts + '</select></div></div>';
    }
    if (cnt) html += '<div class="card"><div class="sem">' + sem + '. semestar</div>' + rows + '</div>';
  }
  $('list').innerHTML = html || '<div class="card">Nema predmeta.</div>';
  stats();
}

function setGrade(i, v){
  var s = subjects[i], old = s.grade;
  s.grade = v === '' ? '' : (v === 'p' ? 'p' : parseInt(v, 10));
  var dbGrade = s.grade === '' ? null : (s.grade === 'p' ? 1 : s.grade);
  stats();
  toast('\u010cuvanje...');
  api('PATCH', 'student_subjects?user_key=eq.' + encodeURIComponent(user.key) + '&subject_id=eq.' + encodeURIComponent(s.id),
    { grade: dbGrade, updated_at: new Date().toISOString() }, function(ok){
      if (ok){ toast('Sa\u010duvano \u2713'); render(); }
      else { s.grade = old; toast('Gre\u0161ka pri \u010duvanju!'); render(); }
    });
}

/* ---------- ZADACI ---------- */
function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtDue(due){
  if (!due) return '';
  var p = String(due).split('-');
  return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : due;
}
function isLate(due, done){ return !!due && !done && due < todayStr(); }

function saveTodos(si, rollback){
  var s = subjects[si];
  toast('\u010cuvanje...');
  api('PATCH', 'student_subjects?user_key=eq.' + encodeURIComponent(user.key) + '&subject_id=eq.' + encodeURIComponent(s.id),
    { todos: s.todos.length ? s.todos : null, updated_at: new Date().toISOString() }, function(ok){
      if (ok){ toast('Sa\u010duvano \u2713'); }
      else { if (rollback) rollback(); toast('Gre\u0161ka pri \u010duvanju!'); }
      renderTasks();
    });
}

function renderTasks(){
  // subject dropdown (keeps selection)
  var sel = $('t-sub'), prev = sel.value;
  var order = [];
  for (var i = 0; i < subjects.length; i++) order.push(i);
  order.sort(function(a, b){
    var x = subjects[a], y = subjects[b];
    return x.semester - y.semester || (x.name < y.name ? -1 : (x.name > y.name ? 1 : 0));
  });
  var o = '';
  for (var k = 0; k < order.length; k++){
    var sb = subjects[order[k]];
    o += '<option value="' + order[k] + '">S' + sb.semester + ' \u2014 ' + esc(sb.name) + '</option>';
  }
  sel.innerHTML = o || '<option value="">Nema predmeta</option>';
  if (prev !== '') sel.value = prev;

  var hide = $('t-hide').checked, all = [];
  for (var a = 0; a < subjects.length; a++){
    var td = subjects[a].todos || [];
    for (var b = 0; b < td.length; b++){
      if (hide && td[b].done) continue;
      all.push({ si: a, ti: b, text: td[b].text, due: td[b].due, done: !!td[b].done, sname: subjects[a].name });
    }
  }
  all.sort(function(p, q){
    if (p.done !== q.done) return p.done ? 1 : -1;
    if (!p.due && !q.due) return 0;
    if (!p.due) return 1;
    if (!q.due) return -1;
    return p.due < q.due ? -1 : (p.due > q.due ? 1 : 0);
  });
  if (!all.length){ $('tl').innerHTML = '<p style="color:#94a3b8;text-align:center">Nema zadataka.</p>'; return; }
  var h = '';
  for (var j = 0; j < all.length; j++){
    var t = all[j];
    h += '<div class="trow' + (t.done ? ' tdone' : '') + '"><div class="c"><input type="checkbox"' + (t.done ? ' checked' : '') +
      ' onchange="toggleTask(' + t.si + ',' + t.ti + ')"></div><div><div class="t">' + esc(t.text) + '</div><div class="tsub">' + nameHtml(subjects[t.si].id, t.sname) +
      '</div></div><div class="d' + (isLate(t.due, t.done) ? ' late' : '') + '">' + (t.due ? 'do ' + fmtDue(t.due) : '') +
      '</div><div class="x"><button onclick="delTask(' + t.si + ',' + t.ti + ')">\u2715</button></div></div>';
  }
  $('tl').innerHTML = h;
}

function addTask(){
  var si = parseInt($('t-sub').value, 10);
  var text = $('t-text').value.replace(/^\s+|\s+$/g,'');
  if (isNaN(si) || !subjects[si]){ toast('Izaberi predmet.'); return; }
  if (!text){ toast('Upi\u0161i zadatak.'); return; }
  var s = subjects[si];
  if (!s.todos) s.todos = [];
  s.todos.push({ text: text, done: false, due: $('t-due').value || '' });
  $('t-text').value = ''; $('t-due').value = '';
  saveTodos(si, function(){ s.todos.pop(); });
}

function toggleTask(si, ti){
  var t = subjects[si].todos[ti];
  t.done = !t.done;
  saveTodos(si, function(){ t.done = !t.done; });
}

function delTask(si, ti){
  if (!confirm('Obrisati zadatak?')) return;
  var s = subjects[si], removed = s.todos.splice(ti, 1)[0];
  saveTodos(si, function(){ s.todos.splice(ti, 0, removed); });
}

/* ---------- USLOVI ---------- */
function renderUslovi(){
  var maxSem = 0, i;
  for (i = 0; i < subjects.length; i++){
    if (subjects[i].grade !== '' && subjects[i].semester > maxSem) maxSem = subjects[i].semester;
  }
  var curYear = maxSem > 0 ? Math.ceil(maxSem / 2) : 1;
  var yEnd = curYear * 2;

  var espbYear = 0, pastUn = [], numSum = 0, numN = 0;
  for (i = 0; i < subjects.length; i++){
    var s = subjects[i];
    if ((s.semester === yEnd - 1 || s.semester === yEnd) && passed(s.grade)) espbYear += s.espb;
    if (s.semester <= yEnd && !passed(s.grade)) pastUn.push(s);
    if (typeof s.grade === 'number' && s.grade >= 6){ numSum += s.grade; numN++; }
  }
  var avg = numN ? numSum / numN : 0;
  var cleared = pastUn.length === 0;
  var budzetOk = espbYear >= 48, samofinOk = espbYear >= 37;
  var stipOk = budzetOk && cleared && avg >= 9.0, kredOk = avg >= 8.5;

  function toExams(espb){ return Math.max(1, Math.ceil(espb / 3)); }
  var bEx = budzetOk ? 0 : toExams(48 - espbYear);
  var sEx = samofinOk ? 0 : toExams(37 - espbYear);
  var stEx = stipOk ? 0 : pastUn.length;
  var kEx = 0;
  if (!kredOk && numN > 0) kEx = Math.max(1, Math.ceil((8.5 * numN - numSum) / 1.5));

  function badge(n){ return n > 0 ? '<span class="ex">\u2248 +' + n + (n === 1 ? ' ispit' : ' ispita') + '</span>' : ''; }
  function row(label, ok, detail, ex){
    return '<div class="urow"><div><div class="ul">' + label + (ok ? '' : badge(ex)) + '</div><div class="us">' + detail +
      '</div></div><div class="bd"><span class="pill ' + (ok ? 'y' : 'n') + '">' + (ok ? '\u2713 Ispunjeno' : '\u2715 Nije ispunjeno') + '</span></div></div>';
  }

  var h = '<p class="us" style="margin-bottom:8px">Na osnovu unetih ocena: <b>' + maxSem + '. semestar</b> (' + curYear + '. godina). ' +
    espbYear + ' ESPB polo\u017eeno u ovoj godini.</p>';
  h += row('Bud\u017eet', budzetOk, espbYear + '/48 ESPB u teku\u0107oj godini (i dovoljan rang na listi)', bEx);
  h += row('Samofinansiranje', samofinOk, espbYear + '/37 ESPB u teku\u0107oj godini' + (samofinOk ? '' : ' \u2014 godina se obnavlja'), sEx);
  h += row('Stipendija', stipOk, 'Bud\u017eet + svi ispiti do sada polo\u017eeni + prosek \u2265 9.00 (trenutno ' + avg.toFixed(2) + ')', stEx);
  h += row('Studentski kredit', kredOk, 'Prosek \u2265 8.50 (trenutno ' + avg.toFixed(2) + ')', kEx);

  if (!cleared){
    var byYear = {}, y;
    for (i = 0; i < pastUn.length; i++){
      y = Math.ceil(pastUn[i].semester / 2);
      if (!byYear[y]) byYear[y] = [];
      byYear[y].push(pastUn[i]);
    }
    h += '<div class="warn"><b>\u26a0 Nepolo\u017eeno do sada (uklju\u010duju\u0107i ovu godinu)</b>';
    for (y = 1; y <= 4; y++){
      if (!byYear[y]) continue;
      h += '<div style="margin-top:8px"><b>' + y + '. godina:</b>';
      for (i = 0; i < byYear[y].length; i++) h += '<div>\u2022 ' + esc(byYear[y][i].name) + '</div>';
      h += '</div>';
    }
    h += '</div>';
  }
  $('ubody').innerHTML = h;
}

/* ---------- RASPORED + PRISUSTVO ---------- */
var DAYS = ['Pon','Uto','Sre','Čet','Pet','Sub'];
var DAYS_FULL = ['Ponedeljak','Utorak','Sreda','Četvrtak','Petak','Subota'];
var COLORS = ['#059669','#6366f1','#f59e0b','#e11d48','#0ea5e9','#a855f7','#14b8a6','#ea580c'];
var DEFAULT_LIMIT = 3;   // dozvoljen broj izostanaka (menja se po predmetu u tabu "Prisustvo")
var WARN_BEFORE = 1;     // crveno ime kad je do limita ostalo ovoliko izostanaka ili manje
var schedYear = 0, schedTab = 'view', editId = null, schedWeek = 0, allSlots = [], att = {};

function enc(s){ return encodeURIComponent(s); }
function newSlotId(i){ return 's' + new Date().getTime() + Math.floor(Math.random() * 100000) + i; }

/* ucitavanje rasporeda i prisustva sa Supabase */
function loadSchedData(cb){
  allSlots = []; att = {};
  var k = enc(user.key);
  api('GET', 'schedule_slots?select=*&user_key=eq.' + k, null, function(ok, d){
    if (ok && d){
      for (var i = 0; i < d.length; i++){
        allSlots.push({ id: d[i].id, sid: d[i].subject_id, name: d[i].subject_name, year: d[i].year, day: d[i].day,
          start: d[i].start_time, end: d[i].end_time, note: d[i].note || '' });
      }
    } else toast('Greška pri učitavanju rasporeda.');
    api('GET', 'attendance?select=slot_id,subject_id,lesson_date,status&user_key=eq.' + k, null, function(ok2, a){
      if (ok2 && a){
        for (var j = 0; j < a.length; j++) att[a[j].slot_id + '|' + a[j].lesson_date] = { sid: a[j].subject_id, status: a[j].status };
      }
      cb();
    });
  });
}

/* pomocne funkcije za izostanke */
function subjById(sid){
  for (var i = 0; i < subjects.length; i++) if (subjects[i].id === sid) return subjects[i];
  return null;
}
function attCount(sid, status){
  var n = 0, k;
  for (k in att) if (att.hasOwnProperty(k) && att[k].sid === sid && att[k].status === status) n++;
  return n;
}
function limitOf(sid){ var s = subjById(sid); return (s && s.limit) || DEFAULT_LIMIT; }
function isWarn(sid){ return attCount(sid, 'absent') >= limitOf(sid) - WARN_BEFORE; }
function nameHtml(sid, name){ return isWarn(sid) ? '<span class="abswarn">' + esc(name) + '</span>' : esc(name); }

function yearSlots(){
  var out = [];
  for (var i = 0; i < allSlots.length; i++) if (allSlots[i].year === schedYear) out.push(allSlots[i]);
  return out;
}
function yearSubjects(){
  var out = [];
  for (var i = 0; i < subjects.length; i++){
    if (Math.ceil(subjects[i].semester / 2) === schedYear) out.push(subjects[i]);
  }
  out.sort(function(a, b){ return a.semester - b.semester || (a.name < b.name ? -1 : (a.name > b.name ? 1 : 0)); });
  return out;
}
function subjName(sl){
  var s = subjById(sl.sid);
  return s ? s.name : (sl.name || '?');
}
function colorFor(sid){
  var n = 0;
  for (var i = 0; i < sid.length; i++) n += sid.charCodeAt(i);
  return COLORS[n % COLORS.length];
}
function normTime(t){
  var m = /^(\d{1,2}):(\d{2})$/.exec(String(t).replace(/^\s+|\s+$/g,''));
  if (!m) return null;
  var h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
  if (h > 23 || mi > 59) return null;
  return pad(h) + ':' + pad(mi);
}
function findSlot(id){
  for (var i = 0; i < allSlots.length; i++) if (allSlots[i].id === id) return allSlots[i];
  return null;
}

/* nedelje i datumi */
function dstr(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function weekStart(){
  var d = new Date(); d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + schedWeek * 7);
  return d;
}
function dayDate(i){ var d = weekStart(); d.setDate(d.getDate() + i); return d; }
function fmtShort(d){ return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.'; }
function shiftWeek(n){ schedWeek += n; renderSched(); }
function thisWeek(){ schedWeek = 0; renderSched(); }

function setSchedYear(y){ schedYear = y; editId = null; renderSched(); }
function setSchedTab(t){ schedTab = t; if (t !== 'edit') editId = null; renderSched(); }

function renderSched(){
  if (!schedYear){
    var mx = 0;
    for (var i = 0; i < subjects.length; i++) if (subjects[i].grade !== '' && subjects[i].semester > mx) mx = subjects[i].semester;
    schedYear = mx > 0 ? Math.ceil(mx / 2) : 1;
    var hasYr = false;
    for (var q = 0; q < allSlots.length; q++) if (allSlots[q].year === schedYear) hasYr = true;
    if (!hasYr && allSlots.length) schedYear = allSlots[0].year;
  }
  var yh = '';
  for (var y = 1; y <= 4; y++) yh += '<button class="yr' + (y === schedYear ? ' on' : '') + '" onclick="setSchedYear(' + y + ')">' + y + '. godina</button>';
  $('s-years').innerHTML = yh;
  $('s-tabs').innerHTML = '<button class="tab' + (schedTab === 'view' ? ' on' : '') + '" onclick="setSchedTab(\'view\')">Pregled</button>' +
    '<button class="tab' + (schedTab === 'stats' ? ' on' : '') + '" onclick="setSchedTab(\'stats\')">Prisustvo</button>' +
    '<button class="tab' + (schedTab === 'edit' ? ' on' : '') + '" onclick="setSchedTab(\'edit\')">Napravi / uredi</button>';
  if (schedTab === 'view') renderSchedView();
  else if (schedTab === 'stats') renderSchedStats();
  else renderSchedEdit();
}

function sortSlots(a){
  a.sort(function(x, y){ return x.start < y.start ? -1 : (x.start > y.start ? 1 : (x.end < y.end ? -1 : 1)); });
}

function renderSchedView(){
  var slots = yearSlots();
  var nav = '<div style="margin-bottom:10px"><button class="btn2" onclick="shiftWeek(-1)">‹</button> ' +
    '<b style="display:inline-block;min-width:150px;text-align:center">' + fmtShort(dayDate(0)) + ' – ' + fmtShort(dayDate(5)) + dayDate(5).getFullYear() + '.</b> ' +
    '<button class="btn2" onclick="shiftWeek(1)">›</button> ' +
    (schedWeek !== 0 ? '<button class="btn2" onclick="thisWeek()">Danas</button>' : '') + '</div>';
  if (!slots.length){
    $('s-body').innerHTML = '<p style="color:#64748b">Raspored za ' + schedYear + '. godinu je prazan. Otvori "Napravi / uredi" da dodaš predmete.</p>';
    return;
  }
  var h = nav + '<table class="wk"><tr>';
  var d, i, today = todayStr();
  for (d = 0; d < 6; d++) h += '<th' + (dstr(dayDate(d)) === today ? ' style="background:#059669"' : '') + '>' + DAYS[d] + '<br><span style="font-weight:normal;font-size:10px">' + fmtShort(dayDate(d)) + '</span></th>';
  h += '</tr><tr>';
  for (d = 0; d < 6; d++){
    var list = [], date = dstr(dayDate(d));
    for (i = 0; i < slots.length; i++) if (slots[i].day === d) list.push(slots[i]);
    sortSlots(list);
    var maxEnd = '', cell = '';
    for (i = 0; i < list.length; i++){
      var sl = list[i];
      var conflict = maxEnd !== '' && sl.start < maxEnd;
      if (sl.end > maxEnd) maxEnd = sl.end;
      var cur = att[sl.id + '|' + date], st = cur ? cur.status : '';
      cell += '<div class="sl" style="border-left-color:' + colorFor(sl.sid) + '"><div class="tm">' + sl.start + '–' + sl.end +
        (conflict ? ' <span class="cf">⚠</span>' : '') + '</div><div>' + nameHtml(sl.sid, subjName(sl)) + '</div>' +
        (sl.note ? '<div class="nt">' + esc(sl.note) + '</div>' : '') +
        '<div class="at"><button class="ab' + (st === 'present' ? ' pon' : '') + '" onclick="markAtt(\'' + sl.id + '\',\'' + date + '\',\'present\')">✓</button>' +
        '<button class="ab' + (st === 'absent' ? ' aon' : '') + '" onclick="markAtt(\'' + sl.id + '\',\'' + date + '\',\'absent\')">✗</button></div></div>';
    }
    h += '<td>' + cell + '</td>';
  }
  h += '</tr></table><p style="font-size:12px;color:#64748b">✓ = bio/la sam, ✗ = izostao/la sam (klik ponovo poništava). ⚠ = preklapa se sa drugim terminom istog dana. Crveno ime = blizu limita izostanaka.</p>';
  $('s-body').innerHTML = h;
}

/* oznacavanje prisustva */
function markAtt(slotId, date, status){
  var sl = findSlot(slotId);
  if (!sl) return;
  if (date > todayStr()){ toast('Ne možeš označiti budući termin.'); return; }
  var key = slotId + '|' + date, cur = att[key], k = enc(user.key);
  if (cur && cur.status === status){
    delete att[key]; renderSched();
    api('DELETE', 'attendance?user_key=eq.' + k + '&slot_id=eq.' + enc(slotId) + '&lesson_date=eq.' + date, null, function(ok){
      if (!ok){ att[key] = cur; toast('Greška pri čuvanju!'); renderSched(); }
      else toast('Poništeno');
    });
    return;
  }
  att[key] = { sid: sl.sid, status: status }; renderSched();
  api('POST', 'attendance?on_conflict=user_key,slot_id,lesson_date',
    { user_key: user.key, slot_id: slotId, subject_id: sl.sid, lesson_date: date, status: status, updated_at: new Date().toISOString() },
    function(ok){
      if (!ok){ if (cur) att[key] = cur; else delete att[key]; toast('Greška pri čuvanju!'); renderSched(); }
      else toast('Sačuvano ✓');
    }, 'resolution=merge-duplicates,return=minimal');
}

/* statistika prisustva po predmetu */
function renderSchedStats(){
  var h = '', any = false, i, j;
  for (i = 0; i < subjects.length; i++){
    var s = subjects[i];
    if (Math.ceil(s.semester / 2) !== schedYear) continue;
    var hasSlot = false;
    for (j = 0; j < allSlots.length; j++) if (allSlots[j].sid === s.id) hasSlot = true;
    var ab = attCount(s.id, 'absent'), pr = attCount(s.id, 'present');
    if (!hasSlot && !ab && !pr) continue;
    any = true;
    var lim = limitOf(s.id), opts = '';
    for (j = 2; j <= 8; j++) opts += '<option value="' + j + '"' + (j === lim ? ' selected' : '') + '>' + j + '</option>';
    h += '<div class="srow"><div><b>' + nameHtml(s.id, s.name) + '</b><div class="us">Bio/la: ' + pr + ' · Izostanci: <b' + (isWarn(s.id) ? ' class="abswarn"' : '') + '>' + ab + ' / ' + lim + '</b>' +
      (ab > lim ? ' · prekoračen limit!' : '') + '</div></div><div class="b"><span class="lbl">limit</span> <select onchange="setLimit(\'' + s.id + '\',this.value)">' + opts + '</select></div></div>';
  }
  $('s-body').innerHTML = any
    ? '<p class="us" style="margin-bottom:6px">Izostanci se broje iz rasporeda (tab Pregled). Limit možeš da promeniš po predmetu.</p>' + h
    : '<p style="color:#64748b">Nema predmeta sa terminima za ' + schedYear + '. godinu. Dodaj termine u "Napravi / uredi".</p>';
}

function setLimit(sid, v){
  var s = subjById(sid); if (!s) return;
  var old = s.limit, n = parseInt(v, 10);
  s.limit = n; renderSched();
  api('PATCH', 'student_subjects?user_key=eq.' + enc(user.key) + '&subject_id=eq.' + enc(sid),
    { absence_limit: n, updated_at: new Date().toISOString() }, function(ok){
      if (ok) toast('Sačuvano ✓');
      else { s.limit = old; toast('Greška pri čuvanju!'); renderSched(); }
    });
}

function renderSchedEdit(){
  var subs = yearSubjects(), slots = yearSlots(), h = '', i;
  if (!subs.length){
    $('s-body').innerHTML = '<p style="color:#64748b">Nema predmeta za ' + schedYear + '. godinu.</p>';
    return;
  }
  var ed = editId ? findSlot(editId) : null;
  h += '<div style="border:2px solid ' + (ed ? '#f59e0b' : '#e2e8f0') + ';border-radius:10px;padding:12px;margin-bottom:14px">';
  h += '<h3>' + (ed ? 'Izmena termina' : 'Novi termin') + '</h3>';
  h += '<span class="lbl">Predmet</span><br><select id="f-sub" style="width:100%;margin:4px 0 12px">';
  for (i = 0; i < subs.length; i++) h += '<option value="' + esc(subs[i].id) + '">S' + subs[i].semester + ' — ' + esc(subs[i].name) + '</option>';
  h += '</select>';
  h += '<span class="lbl">Dan' + (ed ? '' : ' (možeš više)') + '</span><div class="days" style="margin-top:6px">';
  for (i = 0; i < 6; i++) h += '<label><input type="checkbox" name="sd" value="' + i + '">' + DAYS_FULL[i] + '</label>';
  h += '</div>';
  h += '<div class="half"><span class="lbl">Od</span><input type="time" id="f-start" placeholder="08:00"></div>';
  h += '<div class="half"><span class="lbl">Do</span><input type="time" id="f-end" placeholder="09:30"></div>';
  h += '<span class="lbl">Beleska / sala</span><input type="text" id="f-note" placeholder="npr. sala 12, vezbe">';
  h += '<button class="btn" onclick="saveSlot()">' + (ed ? 'Sačuvaj izmenu' : 'Dodaj u raspored') + '</button>';
  if (ed) h += '<div style="margin-top:8px"><button class="btn2" onclick="cancelEdit()">Otkaži izmenu</button></div>';
  h += '</div>';

  h += '<h3>Termini (' + slots.length + ')</h3>';
  if (!slots.length) h += '<p style="color:#94a3b8">Još nema termina.</p>';
  slots = slots.slice();
  slots.sort(function(a, b){ return a.day - b.day || (a.start < b.start ? -1 : 1); });
  for (i = 0; i < slots.length; i++){
    var sl = slots[i];
    h += '<div class="srow"><div><b>' + esc(subjName(sl)) + '</b><div class="us">' + DAYS_FULL[sl.day] + ' ' + sl.start + '–' + sl.end +
      (sl.note ? ' · ' + esc(sl.note) : '') + '</div></div><div class="b"><button onclick="startEdit(\'' + sl.id + '\')">Uredi</button>' +
      '<button onclick="delSlot(\'' + sl.id + '\')">✕</button></div></div>';
  }
  $('s-body').innerHTML = h;

  if (ed){
    $('f-sub').value = ed.sid;
    var cbs = document.getElementsByName('sd');
    for (i = 0; i < cbs.length; i++) cbs[i].checked = (parseInt(cbs[i].value, 10) === ed.day);
    $('f-start').value = ed.start; $('f-end').value = ed.end; $('f-note').value = ed.note || '';
  }
}

function startEdit(id){ editId = id; schedTab = 'edit'; renderSched(); window.scrollTo(0, 0); }
function cancelEdit(){ editId = null; renderSched(); }

function saveSlot(){
  var sid = $('f-sub').value;
  var st = normTime($('f-start').value), en = normTime($('f-end').value);
  var note = $('f-note').value.replace(/^\s+|\s+$/g,'');
  var days = [], cbs = document.getElementsByName('sd'), i;
  for (i = 0; i < cbs.length; i++) if (cbs[i].checked) days.push(parseInt(cbs[i].value, 10));
  if (!days.length){ toast('Izaberi bar jedan dan.'); return; }
  if (!st || !en){ toast('Unesi vreme (npr. 08:00).'); return; }
  if (en <= st){ toast('Kraj mora biti posle početka.'); return; }
  var sname = '';
  for (i = 0; i < subjects.length; i++) if (subjects[i].id === sid) sname = subjects[i].name;
  var ed = editId ? findSlot(editId) : null, newRows = [], edPatch = null;
  for (i = 0; i < days.length; i++){
    if (ed && i === 0){
      edPatch = { subject_id: sid, subject_name: sname, day: days[0], start_time: st, end_time: en, note: note };
    } else {
      newRows.push({ id: newSlotId(i), user_key: user.key, subject_id: sid, subject_name: sname, year: schedYear,
        day: days[i], start_time: st, end_time: en, note: note });
    }
  }
  toast('Čuvanje...');
  function finish(){ editId = null; toast('Sačuvano ✓'); renderSched(); }
  function addNew(){
    if (!newRows.length){ finish(); return; }
    api('POST', 'schedule_slots', newRows, function(ok){
      if (!ok){ toast('Greška pri čuvanju!'); return; }
      for (var j = 0; j < newRows.length; j++){
        var r = newRows[j];
        allSlots.push({ id: r.id, sid: r.subject_id, name: r.subject_name, year: r.year, day: r.day, start: r.start_time, end: r.end_time, note: r.note });
      }
      finish();
    });
  }
  if (edPatch){
    api('PATCH', 'schedule_slots?user_key=eq.' + enc(user.key) + '&id=eq.' + enc(ed.id), edPatch, function(ok){
      if (!ok){ toast('Greška pri čuvanju!'); return; }
      var oldSid = ed.sid;
      ed.sid = sid; ed.name = sname; ed.day = days[0]; ed.start = st; ed.end = en; ed.note = note;
      if (oldSid !== sid){
        for (var k in att) if (att.hasOwnProperty(k) && k.indexOf(ed.id + '|') === 0) att[k].sid = sid;
        api('PATCH', 'attendance?user_key=eq.' + enc(user.key) + '&slot_id=eq.' + enc(ed.id), { subject_id: sid }, function(){});
      }
      addNew();
    });
  } else addNew();
}

function delSlot(id){
  if (!confirm('Obrisati termin? Biće obrisano i njegovo evidentirano prisustvo.')) return;
  api('DELETE', 'schedule_slots?user_key=eq.' + enc(user.key) + '&id=eq.' + enc(id), null, function(ok){
    if (!ok){ toast('Greška pri brisanju!'); return; }
    for (var i = 0; i < allSlots.length; i++) if (allSlots[i].id === id){ allSlots.splice(i, 1); break; }
    for (var k in att) if (att.hasOwnProperty(k) && k.indexOf(id + '|') === 0) delete att[k];
    if (editId === id) editId = null;
    renderSched();
  });
}

/* ---------- auto login ---------- */
(function(){
  try {
    var sv = JSON.parse(localStorage.getItem('liteSession') || 'null');
    if (sv && sv.n && sv.i){ $('ln').value = sv.n; $('li').value = sv.i; doLogin(); }
  } catch (e) {}
})();
